# Optional drop-in for the existing root user's agy installation.
# Keep home directories hidden; expose only the CLI and its own runtime paths.
[Service]
ProtectHome=tmpfs
Environment=HOME=/root
BindReadOnlyPaths=/root/.local/bin/agy /root/.gemini/config
BindPaths=/root/.gemini/antigravity-cli /root/.cache/antigravity
ReadWritePaths=/root/.gemini/antigravity-cli /root/.cache/antigravity
