# Preserve the old service account, filesystem restrictions, outputs and locks.
# Internal requests become one per minute; the bridge also spaces task boundaries.
[Service]
ExecStart=
ExecStart=/mnt/quant/strategies/stocks-quant/web/.venv/bin/python -m web.news_collector --execute --max-requests 3 --requests-per-minute 1 --cache-dir /mnt/quant-state/quant-web/news_cache --output /mnt/quant-state/quant-web/news_timeline.json --audit /mnt/quant-state/quant-web/news_collection_batches.jsonl --lock /mnt/quant-state/quant-web/news_collector.lock --circuit-state /mnt/quant-state/quant-web/news_circuit.json
TimeoutStartSec=5min
